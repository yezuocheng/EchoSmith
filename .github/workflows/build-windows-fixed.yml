name: Build fixed Windows x64 installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Install Python dependencies and models
        run: |
          python -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/download_models.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build backend
        run: |
          ./scripts/build_backend.ps1
          if (!(Test-Path tauri_backend_dist/backend/backend.exe)) { throw 'Backend missing' }
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --package-lock=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test -- --run src/lib/api.test.ts src/components/BatchTaskComposer.test.tsx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare bundle
        run: |
          Copy-Item echo_logo.svg frontend/dist/
          Copy-Item -Recurse tauri_backend_dist/backend tauri/src-tauri/backend
      - name: Build installers
        working-directory: tauri
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build -- --target x86_64-pc-windows-msvc --bundles msi,nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: echosmith-windows-x64
          path: |
            tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
