name: Publish rebuilt macOS DMGs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native macOS build run ID
        required: true
      version:
        description: EchoSmith version in the DMG filename
        required: true
        default: "1.4.4"
      platform:
        description: Artifact platform to publish
        type: choice
        options:
          - macos
          - windows
        default: macos

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified DMG artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          pattern: ${{ inputs.platform == 'windows' && 'echosmith-windows' || 'echosmith-macos-*' }}
          path: artifacts

      - name: Check expected DMGs
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            test -f "artifacts/echosmith-windows/msi/EchoSmith_${VERSION}_x64_en-US.msi"
            test -f "artifacts/echosmith-windows/nsis/EchoSmith_${VERSION}_x64-setup.exe"
            sha256sum artifacts/echosmith-windows/*/*
          else
            test -f "artifacts/echosmith-macos-arm64/EchoSmith_${VERSION}_arm64.dmg"
            test -f "artifacts/echosmith-macos-x64/EchoSmith_${VERSION}_x64.dmg"
            sha256sum artifacts/*/*.dmg
          fi

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          tag="rebuilt-v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "EchoSmith v${VERSION} rebuilt native macOS DMGs" \
              --notes "Native arm64 and x64 builds. Ad-hoc signed; not Apple-notarized."
          fi
          if [ "$PLATFORM" = windows ]; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" artifacts/echosmith-windows/*/*
          else
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*/*.dmg
          fi
